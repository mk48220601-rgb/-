<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<title>우진이 톡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="shell">

  <section id="join" class="screen join">
    <div class="balloons" aria-hidden="true">
      <span class="bln b1"></span><span class="bln b2"></span><span class="bln b3"></span>
      <span class="bln b4"></span><span class="bln b5"></span><span class="bln b6"></span>
    </div>
    <div class="join-inner">
      <div class="mascot-wrap">
        <svg class="mascot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="132" height="132" aria-hidden="true">
          <ellipse cx="60" cy="106" rx="34" ry="7" fill="#E8C77B" opacity=".45"/>
          <g class="m-body">
            <circle cx="36" cy="42" r="9" fill="#FFD54A"/>
            <circle cx="84" cy="42" r="9" fill="#FFD54A"/>
            <circle cx="36" cy="42" r="4.5" fill="#F2A65A"/>
            <circle cx="84" cy="42" r="4.5" fill="#F2A65A"/>
            <circle cx="60" cy="64" r="30" fill="#FFD54A"/>
            <ellipse cx="49" cy="59" rx="4" ry="5" fill="#5B4636"/>
            <circle cx="50.4" cy="57" r="1.4" fill="#fff"/>
            <ellipse cx="71" cy="59" rx="4" ry="5" fill="#5B4636"/>
            <circle cx="72.4" cy="57" r="1.4" fill="#fff"/>
            <ellipse cx="42" cy="69" rx="5" ry="3.4" fill="#FFB27D" opacity=".85"/>
            <ellipse cx="78" cy="69" rx="5" ry="3.4" fill="#FFB27D" opacity=".85"/>
            <rect x="56.5" y="65" width="7" height="5" rx="2.5" fill="#8D5A12"/>
            <path d="M53 73 Q60 80 67 73" stroke="#5B4636" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
          <g class="paw">
            <ellipse cx="98" cy="55" rx="8.5" ry="11" fill="#FFD54A" stroke="#C97B1E" stroke-width="3" transform="rotate(18 98 55)"/>
            <ellipse cx="99" cy="60" rx="2.2" ry="2.6" fill="#C97B1E"/>
          </g>
        </svg>
        <span class="mascot-name">라라</span>
      </div>

      <h1 class="logo">우진이 톡!</h1>
      <p class="tag">우진이만을 위한 우리 가족 대화방 🦁</p>

      <label class="field-label" for="nameInput">이름을 또박또박 적어주세요</label>
      <input id="nameInput" class="name-input" type="text" maxlength="10" placeholder="우진" autocomplete="off">

      <p class="field-label">내 얼굴 고르기 🎨</p>
      <div id="avatarGrid" class="avatars"></div>

      <button id="enterBtn" class="enter-btn" type="button">입장하기 🎈</button>
      <p class="room-note">우진이를 향해 사랑을 또박또박!<br>안전한 말쓰기 지킴이 🛡️와 함께해요.</p>
    </div>
  </section>

  <section id="chat" class="screen chat hidden">
    <header class="chat-head">
      <div class="room">
        <h2 id="roomTitle">우진이와 우리 가족방</h2>
        <div id="presence" class="presence"></div>
      </div>
      <div class="head-ctrl">
        <button id="soundBtn" class="icon-btn" type="button" title="효과음">🔊</button>
        <button id="readBtn" class="icon-btn" type="button" title="소리 내어 읽기">📖</button>
        <button id="parentBtn" class="parent-btn" type="button">🛡️ 부모님</button>
      </div>
    </header>

    <main id="msgs" class="msgs" aria-live="polite"></main>

    <div id="typingRow" class="typing-row hidden"></div>

    <div class="quickbar">
      <div class="qk-tabs">
        <button id="tabPhrase" class="qk-tab on" type="button">문구</button>
        <button id="tabEmoji" class="qk-tab" type="button">이모지</button>
        <button id="tabPlay" class="qk-tab" type="button">놀이</button>
      </div>
      <div id="qkRowF" class="qk-row"></div>
      <div id="qkRowE" class="qk-row hidden"></div>
      <div id="qkRowP" class="qk-row hidden"></div>
    </div>

    <div class="inputbar">
      <input id="input" class="chat-input" type="text" maxlength="300" placeholder="메시지 쓰기…" autocomplete="off" enterkeyhint="send">
      <button id="sendBtn" class="send-btn" type="button" aria-label="보내기">➤</button>
    </div>
  </section>
</div>

<div id="overlay" class="overlay hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="pinView" class="pin-view">
      <h3>🛡️ 부모님 공간</h3>
      <p class="pin-desc">비밀번호를 입력하면<br>지킴이 도구를 열 수 있어요.</p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      <p id="pinErr" class="pin-err hidden">비밀번호가 맞지 않아요. 다시 또박또박 눌러주세요.</p>
      <button id="pinOk" class="sheet-btn primary" type="button">열기 🔓</button>
      <button id="pinClose" class="sheet-btn" type="button">닫기</button>
    </div>

    <div id="panelView" class="panel-view hidden">
      <div class="panel-head">
        <h3>🛡️ 지킴이 도구</h3>
        <button id="parentClose" class="x-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="qk-tabs panel-tabs">
        <button id="tabFamily" class="qk-tab on" type="button">우리 가족</button>
        <button id="tabWords" class="qk-tab" type="button">지킴이 단어</button>
        <button id="tabLog" class="qk-tab" type="button">지킴이 기록</button>
      </div>
      <div id="famList" class="panel-body"></div>
      <div id="wordList" class="panel-body hidden">
        <div class="word-add">
          <input id="wordInput" class="chat-input" type="text" maxlength="20" placeholder="지킬 단어 추가 (예: 욕설)">
          <button id="wordAdd" class="sheet-btn primary" type="button">추가</button>
        </div>
        <div id="wordChips" class="word-chips"></div>
      </div>
      <div id="logView" class="panel-body hidden">
        <p class="log-desc">🍬 사탕으로 바뀐 메시지를 확인할 수 있어요.</p>
        <div id="logList" class="log-list"></div>
      </div>
      <button id="exportBtn" class="sheet-btn" type="button">📄 대화 기록 내보내기</button>
    </div>
  </div>
</div>

<div id="popover" class="popover hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
